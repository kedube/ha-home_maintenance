# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/*" = [
    "S101", # asserts are the point of tests
    "ANN", # test signatures don't need annotations
    "D103", # test names are the documentation
    "ARG001", # fixtures are injected by name and not always referenced
    "PLR2004", # literal expected values are clearer than constants
    "PLC0415", # local imports keep patch targets obvious
    "TC001", # runtime imports of application types are fine in tests
    "S603", # subprocess with fixed args drives git in scratch repos
    "S607", # resolving git from PATH is fine in tests
]
"custom_components/home_maintenance/triggers.py" = [
    "ARG002", # strategy methods share a uniform signature; not every strategy uses every argument
]
".github/scripts/*" = [
    "INP001", # standalone CLI scripts, not a package
    "T201", # print is the scripts' output interface
    "PLR2004", # sys.argv length checks
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
